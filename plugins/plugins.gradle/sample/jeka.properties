jeka.java.version=21

# Load the Gradle plugin JAR built locally
jeka.classpath=../jeka-output/dev.jeka.gradle-plugin.jar

# Delegate the build to GradleKBean, targeting the 'app' sub-module
jeka.program.build=gradle: wrapBuild appModule=app

# Native build: requires GraalVM as the current JDK
jeka.program.build.native=gradle: wrapNative appModule=app -Djeka.java.distrib=graalvm -Djeka.java.version=24
